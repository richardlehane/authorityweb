<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Authority Editor</title>
    <meta name="viewport" content="width=device-width" />
    <style>
        :root {
            --back-color: #f4f7ff;
            --text-color: #342602;
        }

        /* minimalist reset */
        * {
            padding: 0;
            margin: 0;
            font-size: 1em;
        }

        body {
            background-color: var(--back-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
        }

        main {
            margin: 0 auto;
            padding: 30px 140px 0 140px;
            max-width: 600px;
            min-height: 100vh;
        }

        h1 {
            font-size: 1.5em;
            font-weight: 700;
            display: inline;
            margin-right: 5px;
        }

        h2 {
            margin-top: 10px;
            font-size: 1.2em;
        }

        h3 {
            font-weight: 400;
            margin-bottom: 30px;
        }

        footer {
            text-align: right;
            margin-top: 80px;
            padding-bottom: 20px;
        }

        p {
            line-height: 1.5em;
            margin-top: 10px;
            display: block;
        }

        a {
            color: inherit;
        }

        a:hover,
        a:focus {
            color: var(--back-color);
            background-color: var(--text-color);
        }

        ol {
            counter-reset: item;
        }

        ol>li {
            counter-increment: item;
            list-style: none inside;
            margin: 20px 0;
            overflow: hidden;
            line-height: 1.5em;
        }

        ol>li:before {
            content: counter(item);
            margin-right: 10px;
            padding: 8px;
            border-radius: 50%;
            width: 25px;
            background: var(--text-color);
            color: var(--back-color);
            text-align: center;
            float: left;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            main {
                max-width: 600px;
                padding: 10px;
            }

            h2 {
                font-size: 1.2em;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Authority Editor</h1>
        <h2>Downloads</h2>
        <p><a href="/downloads/authorityeditor.msi">Install for Windows</a></p>
        <h2>Try it online</h2>
        <p>Try <a href="/nsw">Authority Editor online</a></p>
    </main>
</body>

</html>
