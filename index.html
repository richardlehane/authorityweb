<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Authority Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Authority Editor - A software application for managing authority files">
    <style>
        :root {
            --back-color: #FAF9F8;
            --text-color: #d1540a;
            --card-bg: #ffffff;
            --card-shadow: rgba(52, 38, 2, 0.1);
            --card-hover-shadow: rgba(52, 38, 2, 0.2);
            --accent-color: #f7630c;
        }

        /* minimalist reset */
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--back-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            line-height: 1.6;
        }

        main {
            margin: 0 auto;
            max-width: 1200px;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 20px 15px 10px;
        }

        .hero h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        .hero-image {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 40px var(--card-shadow);
        }

        /* Cards Section */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 10px 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px var(--card-shadow);
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px var(--card-hover-shadow);
        }

        .card-icon {
            width: 60px;
            height: 60px;
            fill: var(--accent-color);
            flex-shrink: 0;
        }

        .card h2 {
            font-size: 1.4em;
            font-weight: 600;
            margin: 0;
        }

        .card p {
            font-size: 0.95em;
            line-height: 1.5;
            color: #666;
            margin: 0;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px 15px;
            margin-top: 30px;
            border-top: 1px solid rgba(52, 38, 2, 0.1);
        }

        footer a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9em;
        }

        footer a:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2em;
            }

            .cards-container {
                grid-template-columns: 1fr;
                padding: 10px;
            }

            .card {
                padding: 18px;
            }
        }

        @media (max-width: 480px) {
            .hero {
                padding: 15px 10px 8px;
            }

            .hero h1 {
                font-size: 1.75em;
                margin-bottom: 10px;
            }

            .card {
                padding: 15px;
            }

            .card-icon {
                width: 50px;
                height: 50px;
            }

            footer {
                padding: 15px 10px;
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>
    <main>
        <!-- Hero Section -->
        <section class="hero">
            <img src="screenshot.png" alt="Authority Editor Application Screenshot" class="hero-image">
        </section>

        <!-- Cards Section -->
        <section class="cards-container">
            <!-- Windows Store Card -->
            <a href="https://apps.microsoft.com/detail/9N3BXXQTLVLN?hl=en-us&gl=AU&ocid=pdpshare" class="card">
                <svg class="card-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.9-1.801" />
                </svg>
                <h2>Windows App</h2>
                <p>Download from the Microsoft Store</p>
            </a>

            <!-- Online Version Card -->
            <a href="/nsw" class="card">
                <svg class="card-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" />

                <p>Try Authority Editor in your browser</p>
            </a>

            <!-- GitHub Repository Card -->
            <a href="https://github.com/richardlehane/authorityeditor" class="card">
                <svg class="card-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z" />
                </svg>
                <h2>Source Code</h2>
                <p>View the source code on GitHub</p>
            </a>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <a href="/privacy.html">Privacy Policy</a>
    </footer>
</body>

</html>
